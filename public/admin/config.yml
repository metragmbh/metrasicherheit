backend:
  name: git-gateway
  branch: master

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

site_url: https://www.metra-sicherheitsdienste.de
display_url: https://www.metra-sicherheitsdienste.de
logo_url: /images/logoneu.png
locale: de

# Für lokale Entwicklung (optional)
# local_backend: true

#######################################
# HILFSFELDER
#######################################

icon_field: &icon_field
  label: "Icon (SVG Path)"
  name: "icon"
  widget: "string"
  required: false

#######################################
# COLLECTIONS
#######################################

collections:

  #-----------------------------------#
  # 1. GLOBALE EINSTELLUNGEN
  #-----------------------------------#
  - name: "settings"
    label: "⚙️ Globale Einstellungen"
    editor:
      preview: false
    files:
      - file: "src/data/cms/settings.json"
        label: "SEO, Header, Footer & Kontakt"
        name: "settings"
        fields:
          # SEO Defaults
          - label: "🌐 SEO & Meta"
            name: "seo"
            widget: "object"
            collapsed: false
            fields:
              - { label: "Default Seiten-Titel", name: "default_title", widget: "string", default: "METRA Sicherheitsdienste GmbH | Schutz · Präsenz · Verantwortung" }
              - { label: "Default Meta-Beschreibung", name: "default_description", widget: "text", default: "Professionelle Sicherheitslösungen für Baustellen, Immobilien und Unternehmen. 24/7 Sicherheitsdienste, Brandwachen, Objektschutz und exklusive Concierge-Dienste." }
              - { label: "OG-Bild", name: "og_image", widget: "image", default: "/images/hero-sicherheit.webp", required: false }
              - { label: "Site URL", name: "site_url", widget: "string", default: "https://www.metra-sicherheitsdienste.de" }

          # Unternehmensdaten
          - label: "🏢 Unternehmensdaten"
            name: "company"
            widget: "object"
            collapsed: false
            fields:
              - { label: "Firmenname", name: "name", widget: "string", default: "METRA Sicherheitsdienste GmbH" }
              - { label: "Rechtsform", name: "legal_form", widget: "string", default: "GmbH" }
              - { label: "Geschäftsführer", name: "owner", widget: "string", default: "D. Mrkaja" }
              - { label: "Straße", name: "street", widget: "string", default: "Im Mediapark 5" }
              - { label: "PLZ", name: "zip", widget: "string", default: "50670" }
              - { label: "Stadt", name: "city", widget: "string", default: "Köln" }
              - { label: "Land", name: "country", widget: "string", default: "Deutschland" }
              - { label: "Telefon (Anzeige)", name: "phone_display", widget: "string", default: "0800 8888 369" }
              - { label: "Telefon (Raw für Links)", name: "phone_raw", widget: "string", default: "08008888369" }
              - { label: "E-Mail", name: "email", widget: "string", default: "info@metra-sicherheitsdienste.de" }
              - { label: "Webseite", name: "web", widget: "string", default: "www.metra-sicherheitsdienste.de" }
              - { label: "USt-IdNr.", name: "vat_id", widget: "string", default: "[USt-IdNr. wird ergänzt]" }
              - { label: "Handelsregister", name: "registration", widget: "string", default: "HRB 127543" }
              - { label: "Registergericht", name: "registry_court", widget: "string", default: "Amtsgericht Köln" }
              - { label: "Datenschutzbeauftragter", name: "dsb", widget: "string", default: "D. Mrkaja" }
              - { label: "DSB E-Mail", name: "dsb_email", widget: "string", default: "info@metra-sicherheitsdienste.de" }
              - { label: "WhatsApp-Nummer (für wa.me/ Link)", name: "whatsapp_number", widget: "string", default: "491738888378" }

          # Header
          - label: "📍 Header & Navigation"
            name: "header"
            widget: "object"
            collapsed: false
            fields:
              - { label: "Claim unter Logo", name: "claim", widget: "string", default: "Sicherheit & Struktur – auf die Sie bauen können." }
              - label: "Navigation"
                name: "nav_links"
                widget: "list"
                collapsed: false
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "URL", name: "href", widget: "string" }
                  - { label: "ARIA-Label", name: "aria_label", widget: "string", required: false }
              - { label: "CTA-Button Text", name: "cta_text", widget: "string", default: "Angebot anfordern" }
              - { label: "CTA-Button ARIA-Label", name: "cta_aria_label", widget: "string", default: "Sicherheitslösung anfragen", required: false }

          # Footer
          - label: "🦶 Footer"
            name: "footer"
            widget: "object"
            collapsed: false
            fields:
              - { label: "Claim unter Logo", name: "claim", widget: "string", default: "Schutz · Präsenz · Verantwortung" }
              - label: "Service-Links"
                name: "service_links"
                widget: "list"
                collapsed: true
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "URL", name: "href", widget: "string" }
              - label: "Unternehmen-Links"
                name: "company_links"
                widget: "list"
                collapsed: true
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "URL", name: "href", widget: "string" }
              - label: "Rechtliche Links"
                name: "legal_links"
                widget: "list"
                collapsed: true
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "URL", name: "href", widget: "string" }
              - { label: "Disclaimer-Text", name: "disclaimer", widget: "text", default: "Sicherheitsdienstleistungen erfolgen im Rahmen der gesetzlichen Bestimmungen nach § 34a GewO." }

  #-----------------------------------#
  # 2. STARTSEITE
  #-----------------------------------#
  - name: "homepage"
    label: "🏠 Startseite"
    editor:
      preview: false
    files:
      - file: "src/data/cms/homepage.json"
        label: "Alle Inhalte"
        name: "homepage"
        fields:
          # Hero
          - label: "🦸 Hero-Bereich"
            name: "hero"
            widget: "object"
            collapsed: false
            fields:
              - { label: "Headline", name: "title", widget: "string", default: "Operative Sicherheit für Baustellen, Objekte und Industrie" }
              - { label: "Subline", name: "subtitle", widget: "text", default: "Strukturiert geplant. Verbindlich umgesetzt. Revisionssicher dokumentiert." }
              - { label: "CTA-Text", name: "cta_text", widget: "string", default: "Sicherheitskonzept anfragen →" }
              - { label: "CTA-ARIA-Label", name: "cta_aria_label", widget: "string", default: "Sicherheitskonzept anfragen", required: false }
              - { label: "Hero-Bild", name: "image", widget: "image", default: "/images/hero-sicherheit.webp" }
              - label: "Trust Badges"
                name: "trust_badges"
                widget: "list"
                collapsed: true
                fields:
                  - { label: "Badge-Text", name: "text", widget: "string" }

          # Problem / Lösung
          - label: "⚠️ Problem & Lösung"
            name: "problem_solution"
            widget: "object"
            collapsed: true
            fields:
              - label: "Herausforderung"
                name: "problem"
                widget: "object"
                fields:
                  - { label: "Label", name: "label", widget: "string", default: "DIE HERAUSFORDERUNG" }
                  - { label: "Titel", name: "title", widget: "string", default: "Reale Risiken. Messbare Schäden." }
                  - { label: "Text Absatz 1", name: "text_1", widget: "text" }
                  - { label: "Text Absatz 2", name: "text_2", widget: "text" }
              - label: "Lösung"
                name: "solution"
                widget: "object"
                fields:
                  - { label: "Label", name: "label", widget: "string", default: "UNSERE LÖSUNG" }
                  - { label: "Titel", name: "title", widget: "string", default: "Ein Ansprechpartner. Vollständige Verantwortung." }
                  - { label: "Text", name: "text", widget: "text" }
              - label: "Benefits (4 Stück)"
                name: "benefits"
                widget: "list"
                collapsed: false
                fields:
                  - { label: "Titel", name: "title", widget: "string" }
                  - { label: "Beschreibung", name: "description", widget: "string" }
                  - <<: *icon_field

          # Prozess
          - label: "🔄 4-Schritte-Prozess"
            name: "process"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Label", name: "label", widget: "string", default: "PROZESS" }
              - { label: "Titel", name: "title", widget: "string", default: "Von der Analyse zum laufenden Betrieb" }
              - label: "Schritte"
                name: "steps"
                widget: "list"
                fields:
                  - { label: "Titel", name: "title", widget: "string" }
                  - { label: "Beschreibung", name: "description", widget: "text" }
                  - <<: *icon_field

          # Services (5 feste, nicht wiederholbar)
          - label: "🛡️ Services (5 Stück)"
            name: "services"
            widget: "object"
            collapsed: true
            fields:
              - label: "Service 1 – Objektschutz"
                name: "service_1"
                widget: "object"
                collapsed: true
                fields:
                  - { label: "Titel", name: "title", widget: "string", default: "Objektschutz" }
                  - { label: "Kurzbeschreibung (Home)", name: "description_short", widget: "text", default: "Bewachung von Gebäuden mit klaren Kontrollprozessen." }
                  - { label: "Bild", name: "image", widget: "image", default: "/images/service-objekt.webp" }
                  - <<: *icon_field
                  - { label: "Premium?", name: "is_premium", widget: "boolean", default: false }
              - label: "Service 2 – Baustellensicherheit"
                name: "service_2"
                widget: "object"
                collapsed: true
                fields:
                  - { label: "Titel", name: "title", widget: "string", default: "Baustellensicherheit" }
                  - { label: "Kurzbeschreibung (Home)", name: "description_short", widget: "text", default: "Absicherung aktiver Baustellen mit definierten Abläufen." }
                  - { label: "Bild", name: "image", widget: "image", default: "/images/service-baustelle.webp" }
                  - <<: *icon_field
                  - { label: "Premium?", name: "is_premium", widget: "boolean", default: false }
              - label: "Service 3 – Werkschutz"
                name: "service_3"
                widget: "object"
                collapsed: true
                fields:
                  - { label: "Titel", name: "title", widget: "string", default: "Werkschutz" }
                  - { label: "Kurzbeschreibung (Home)", name: "description_short", widget: "text", default: "Sicherung von Produktions- und Logistikstandorten." }
                  - { label: "Bild", name: "image", widget: "image", default: "/images/service-werk.webp" }
                  - <<: *icon_field
                  - { label: "Premium?", name: "is_premium", widget: "boolean", default: false }
              - label: "Service 4 – Brandwachen"
                name: "service_4"
                widget: "object"
                collapsed: true
                fields:
                  - { label: "Titel", name: "title", widget: "string", default: "Brandwachen" }
                  - { label: "Kurzbeschreibung (Home)", name: "description_short", widget: "text", default: "Absicherung bei feuergefährlichen Arbeiten." }
                  - { label: "Bild", name: "image", widget: "image", default: "/images/service-brandwache.webp" }
                  - <<: *icon_field
                  - { label: "Premium?", name: "is_premium", widget: "boolean", default: false }
              - label: "Service 5 – Empfang & Concierge"
                name: "service_5"
                widget: "object"
                collapsed: true
                fields:
                  - { label: "Titel", name: "title", widget: "string", default: "Empfang & Concierge" }
                  - { label: "Kurzbeschreibung (Home)", name: "description_short", widget: "text", default: "Kombination aus Zutrittskontrolle und Empfangsdienstleistungen." }
                  - { label: "Bild", name: "image", widget: "image", default: "/images/service-concierge.webp" }
                  - <<: *icon_field
                  - { label: "Premium?", name: "is_premium", widget: "boolean", default: false }

          # Differenzierung
          - label: "✅ Differenzierung"
            name: "differentiation"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Label", name: "label", widget: "string", default: "DIFFERENZIERUNG" }
              - { label: "Titel", name: "title", widget: "string", default: "Struktur und Verantwortung im Einsatz" }
              - label: "Punkte"
                name: "points"
                widget: "list"
                fields:
                  - { label: "Text", name: "text", widget: "string" }

          # Warum METRA
          - label: "⭐ Warum METRA"
            name: "why_metra"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Titel", name: "title", widget: "string", default: "Warum METRA Sicherheitsdienste" }
              - { label: "Untertitel", name: "subtitle", widget: "string", default: "Sicherheit & Struktur – auf die Sie bauen können." }
              - label: "Punkte"
                name: "points"
                widget: "list"
                fields:
                  - { label: "Text", name: "text", widget: "string" }

          # CTA
          - label: "📢 Call-to-Action"
            name: "cta"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Titel", name: "title", widget: "string", default: "Lassen Sie uns Ihr Projekt absichern." }
              - { label: "Text", name: "text", widget: "text" }
              - { label: "Button-Text", name: "button_text", widget: "string", default: "Sicherheitskonzept anfragen →" }
              - { label: "Button-ARIA-Label", name: "button_aria_label", widget: "string", default: "Sicherheitskonzept anfragen", required: false }

          # SEO
          - label: "🔍 SEO"
            name: "seo"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Seiten-Titel", name: "title", widget: "string", default: "METRA Sicherheitsdienste GmbH | Operative Sicherheit für Baustellen, Objekte und Industrie" }
              - { label: "Meta-Beschreibung", name: "description", widget: "text", default: "Operative Sicherheit für Baustellen, Objekte und Industrie. Strukturiert geplant. Verbindlich umgesetzt. Revisionssicher dokumentiert." }



  #-----------------------------------#
  # 3. LEISTUNGEN
  #-----------------------------------#
  - name: "leistungen"
    label: "🛠️ Leistungen"
    editor:
      preview: false
    files:
      - file: "src/data/cms/leistungen.json"
        label: "Alle Inhalte"
        name: "leistungen"
        fields:
          # Hero
          - label: "🦸 Hero"
            name: "hero"
            widget: "object"
            collapsed: false
            fields:
              - { label: "Label", name: "label", widget: "string", default: "LEISTUNGEN" }
              - { label: "Titel", name: "title", widget: "string", default: "Sicherheitsleistungen für definierte Einsatzbereiche" }
              - { label: "Beschreibung", name: "description", widget: "text", default: "Strukturiert geplant und verbindlich umgesetzt – für Baustellen, Objekte und Industrie." }

          # Trust Badges
          - label: "🏅 Trust Badges"
            name: "trust_badges"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Titel", name: "title", widget: "string", default: "Zertifiziert für professionelle Einsatzbereiche" }
              - label: "Badges"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Text", name: "text", widget: "string" }

          # Services Detail (5 feste)
          - label: "📋 Services Detail"
            name: "services_detail"
            widget: "object"
            collapsed: true
            fields:
              - label: "Service 1 – Objektschutz"
                name: "service_1"
                widget: "object"
                collapsed: true
                fields:
                  - { label: "Titel", name: "title", widget: "string", default: "Objektschutz" }
                  - { label: "Beschreibung (lang)", name: "description", widget: "text" }
                  - { label: "Bild", name: "image", widget: "image", default: "/images/service-objekt.webp" }
                  - <<: *icon_field
                  - label: "Features"
                    name: "features"
                    widget: "list"
                    fields:
                      - { label: "Feature", name: "text", widget: "string" }
              - label: "Service 2 – Baustellensicherheit"
                name: "service_2"
                widget: "object"
                collapsed: true
                fields:
                  - { label: "Titel", name: "title", widget: "string", default: "Baustellensicherheit" }
                  - { label: "Beschreibung (lang)", name: "description", widget: "text" }
                  - { label: "Bild", name: "image", widget: "image", default: "/images/service-baustelle.webp" }
                  - <<: *icon_field
                  - label: "Features"
                    name: "features"
                    widget: "list"
                    fields:
                      - { label: "Feature", name: "text", widget: "string" }
              - label: "Service 3 – Werkschutz"
                name: "service_3"
                widget: "object"
                collapsed: true
                fields:
                  - { label: "Titel", name: "title", widget: "string", default: "Werkschutz" }
                  - { label: "Beschreibung (lang)", name: "description", widget: "text" }
                  - { label: "Bild", name: "image", widget: "image", default: "/images/service-werk.webp" }
                  - <<: *icon_field
                  - label: "Features"
                    name: "features"
                    widget: "list"
                    fields:
                      - { label: "Feature", name: "text", widget: "string" }
              - label: "Service 4 – Brandwachen"
                name: "service_4"
                widget: "object"
                collapsed: true
                fields:
                  - { label: "Titel", name: "title", widget: "string", default: "Brandwachen – rechtssicher und einsatzbereit" }
                  - { label: "Beschreibung (lang)", name: "description", widget: "text" }
                  - { label: "Bild", name: "image", widget: "image", default: "/images/service-brandwache.webp" }
                  - <<: *icon_field
                  - label: "Features"
                    name: "features"
                    widget: "list"
                    fields:
                      - { label: "Feature", name: "text", widget: "string" }
              - label: "Service 5 – Empfang & Concierge"
                name: "service_5"
                widget: "object"
                collapsed: true
                fields:
                  - { label: "Titel", name: "title", widget: "string", default: "Empfang & Concierge" }
                  - { label: "Beschreibung (lang)", name: "description", widget: "text" }
                  - { label: "Bild", name: "image", widget: "image", default: "/images/service-concierge.webp" }
                  - <<: *icon_field
                  - label: "Features"
                    name: "features"
                    widget: "list"
                    fields:
                      - { label: "Feature", name: "text", widget: "string" }

          # Benefits
          - label: "✨ Benefits"
            name: "benefits"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Label", name: "label", widget: "string", default: "DIFFERENZIERUNG" }
              - { label: "Titel", name: "title", widget: "string", default: "Struktur und Verantwortung im Einsatz" }
              - label: "Benefits (6 Stück)"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Titel", name: "title", widget: "string" }
                  - { label: "Beschreibung", name: "description", widget: "string" }
                  - <<: *icon_field

          # Prozess Teaser
          - label: "🔗 Prozess-Teaser"
            name: "process_teaser"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Label", name: "label", widget: "string", default: "UNSER VORGEHEN" }
              - { label: "Titel", name: "title", widget: "string", default: "Strukturiert zum Sicherheitserfolg" }
              - { label: "Text", name: "text", widget: "text" }
              - { label: "Button-Text", name: "button_text", widget: "string", default: "4-Schritte-Ansatz ansehen" }
              - label: "Schritte (4 Stück)"
                name: "steps"
                widget: "list"
                fields:
                  - { label: "Titel", name: "title", widget: "string" }
                  - { label: "Beschreibung", name: "description", widget: "string" }

          # CTA
          - label: "📢 Call-to-Action"
            name: "cta"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Titel", name: "title", widget: "string", default: "Lassen Sie uns Ihr Projekt absichern." }
              - { label: "Text", name: "text", widget: "text" }
              - { label: "Button-Text", name: "button_text", widget: "string", default: "Sicherheitskonzept anfragen →" }
              - { label: "Button-ARIA-Label", name: "button_aria_label", widget: "string", default: "Sicherheitskonzept anfragen", required: false }

          # SEO
          - label: "🔍 SEO"
            name: "seo"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Seiten-Titel", name: "title", widget: "string", default: "Leistungen | METRA Sicherheitsdienste GmbH" }
              - { label: "Meta-Beschreibung", name: "description", widget: "text", default: "Sicherheitsleistungen für definierte Einsatzbereiche. Strukturiert geplant und verbindlich umgesetzt – für Baustellen, Objekte und Industrie." }


  #-----------------------------------#
  # 4. KONTAKT
  #-----------------------------------#
  - name: "kontakt"
    label: "📞 Kontakt"
    editor:
      preview: false
    files:
      - file: "src/data/cms/kontakt.json"
        label: "Alle Inhalte"
        name: "kontakt"
        fields:
          - label: "🦸 Hero"
            name: "hero"
            widget: "object"
            collapsed: false
            fields:
              - { label: "Label", name: "label", widget: "string", default: "KONTAKT" }
              - { label: "Titel", name: "title", widget: "string", default: "Projektanfrage & Sicherheitskonzept" }
              - { label: "Beschreibung", name: "description", widget: "text", default: "Beschreiben Sie Ihr Objekt oder Projekt. Auf dieser Grundlage erfolgt eine strukturierte Bewertung und Abstimmung der weiteren Schritte." }

          - label: "📋 Kontakt-Daten (Sidebar)"
            name: "contact_info"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Telefon-Label", name: "phone_label", widget: "string", default: "Telefon" }
              - { label: "E-Mail-Label", name: "email_label", widget: "string", default: "E-Mail" }
              - { label: "WhatsApp-Label", name: "whatsapp_label", widget: "string", default: "WhatsApp" }
              - { label: "WhatsApp-Text", name: "whatsapp_text", widget: "string", default: "Direkte Anfrage möglich" }

          - label: "📝 Formular"
            name: "form"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Titel", name: "title", widget: "string", default: "Anfrage übermitteln" }
              - { label: "Untertitel", name: "subtitle", widget: "text", default: "Übermitteln Sie die wichtigsten Projektdaten." }
              - { label: "Name-Label", name: "label_name", widget: "string", default: "Name" }
              - { label: "Name-Placeholder", name: "placeholder_name", widget: "string", default: "Ihr vollständiger Name" }
              - { label: "E-Mail-Label", name: "label_email", widget: "string", default: "E-Mail" }
              - { label: "E-Mail-Placeholder", name: "placeholder_email", widget: "string", default: "Kontaktadresse" }
              - { label: "Telefon-Label", name: "label_phone", widget: "string", default: "Telefon" }
              - { label: "Telefon-Placeholder", name: "placeholder_phone", widget: "string", default: "für Rückfragen" }
              - { label: "Leistungsbereich-Label", name: "label_service", widget: "string", default: "Leistungsbereich" }
              - { label: "Nachricht-Label", name: "label_message", widget: "string", default: "Nachricht" }
              - { label: "Nachricht-Placeholder", name: "placeholder_message", widget: "string", default: "Beschreiben Sie Ihr Projekt, Einsatzort und Anforderungen." }
